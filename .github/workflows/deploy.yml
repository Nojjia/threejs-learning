name: Deploy Github Page
run-name: Three.js website deployed by ${{ github.actor }}
on:
  push:
    branches:
      - main
  workflow_displath:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Clean install project
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build files/artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy Github Pages
        id: deployment
        uses: actions/deploy-pages@v5
